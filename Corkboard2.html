<script id="script-utility">
    function moveElementToMouse(element, offsetX=0, offsetY=0, mouseEvent=event) {
        element.style.left = mouseEvent.clientX + offsetX + "px";
        element.style.top = mouseEvent.clientY + offsetY + "px";
    }

    function mainToScreenCoords(x, y) {
        return {
            x: x * pageSettings.zoom + pageSettings.pan.x,
            y: y * pageSettings.zoom + pageSettings.pan.y,
        };
    }

    function screenToMainCoords(x, y) {
        return {
            x: (x - pageSettings.pan.x) / pageSettings.zoom,
            y: (y - pageSettings.pan.y) / pageSettings.zoom,
        };
    }

</script>
<script id="script-save">
    function save() {
        const saveObject = {
            version: 1,
            filename: pageSettings.filename,
            cards: cardSettings.activeCards.map(card => card.save()),
            groupings: groupingSettings.activeGroupings.map(grouping => grouping.save()),
        }

        return btoa(JSON.stringify(saveObject));
    }

    function load(saveString) {
        const saveObject = JSON.parse(atob(saveString));
        switch (saveObject.version) {
            case 1:
                load_1(saveObject);
                break;
            default:
                console.error("Unknown version number: " + saveObject.version);
        }
    }

    function clear() {
        pageSettings.filename = "file";
        cardSettings.activeCards.forEach(card => card.remove());
        groupingSettings.activeGroupings.forEach(grouping => grouping.remove());
    }

    function clearWithConfirm() {   
        if (!confirm("Are you sure you wish to clear the current page?")) return;
        clear();
    }

    function reload() {
        const saveString = save();
        clear();
        load(saveString);
    }

    function load_1(saveObject) {
        pageSettings.filename = saveObject.filename;
        saveObject.cards.forEach(cardString => main.append(Card.load(cardString)));
        saveObject.groupings.forEach(groupingString => main.append(Grouping.load(groupingString)));
        loadPinStrings(saveObject.cards);
    }

    function saveLocal() {
        const saveString = save();
        localStorage.setItem("save", saveString);
    }

    function loadLocal() {
        const saveString = localStorage.getItem("save");
        if (saveString !== null) load(saveString);
    }

    function saveLocalWithConfirm() {
        saveLocal();
        alert("Save Successful!");
    }

    function loadLocalWithConfirm() {
        if (!confirm("Are you sure you wish to overwrite the current page?")) return;
        clear();
        loadLocal();
    }

    function saveFile() {
        const filename = prompt("Enter File Name: ", pageSettings.filename);
        if (filename === null) return;
        pageSettings.filename = filename.split(".")[0]
        const saveLink = document.createElement("a");
        saveLink.href = "data:text/plain," + save();
        saveLink.download = pageSettings.filename + ".board2";
        saveLink.click();
    }

    function loadFile() {
        if (!confirm("Are you sure you wish to overwrite the current page?")) return;
        clear();
        const loadInput = document.createElement("input");
        loadInput.type = "file";
        loadInput.accept = ".board,.board2";
        loadInput.addEventListener("input", () => {
            const reader = new FileReader();
            reader.addEventListener("load", () => {
                switch (loadInput.files[0].name.split(".")[1]) {
                    case "board":
                        load_board(reader.result);
                        break;
                    case "board2":
                        load(reader.result);
                        break;
                    default:
                        console.error("Unrecognised format: " + loadInput.files[0].name.split(".")[1]);
                }
            })
            reader.readAsText(loadInput.files[0]);
        });
        loadInput.click();
    }

    function load_board(saveString) {
        const saveObject = JSON.parse(saveString);

        const unlinkedCards = {};

        let maxCard = 0;
        for (const i in saveObject) maxCard = Math.max(maxCard, parseInt(i));

        for (let i=0; i<maxCard; i++) {
            // Card didn't exist, add Placeholder to maintain positions
            if (saveObject[`${i}`] === undefined) {
                cardSettings.activeCards.push(null);
                continue;
            }

            const cardObject = saveObject[`${i}`];

            const card = new Card("medium");
            card.x = cardObject.position.x;
            card.y = cardObject.position.y;
            card.rotate = "0deg";

            const hasTitle = cardObject.title !== undefined;
            const hasImage = cardObject.image !== undefined;
            const hasCaption = cardObject.caption !== undefined;
            const hasComments = cardObject.comments !== undefined;
            const hasLinkedComment = !hasTitle && !hasImage && !hasCaption && hasComments;

            // Card is empty, add Placeholder to maintain positions
            if (!hasTitle && !hasImage && !hasCaption && !hasComments) {
                cardSettings.activeCards.push(null);
                continue;
            }

            // Add Title Section
            if (hasTitle) {
                const title = new TextSection();
                title.text = cardObject.title;
                title.fontSize.current = 10;
                title.bold = true;
                title.pins.left.state = true;
                title.pins.right.state = true;
                card.sections.push(title);
            }

            // Add Image Section
            if (hasImage) {
                const image = new ImageSection();
                if (!hasTitle) {
                    image.pins.left.state = true;
                    image.pins.right.state = true;
                }
                card.sections.push(image);
            }

            // Add Caption Section
            if (hasCaption) {
                const caption = new TextSection();
                caption.text = cardObject.caption;
                caption.italic = true;
                if (!hasTitle && !hasImage) {    
                    caption.pins.left.state = true;
                    caption.pins.right.state = true;
                }
                card.sections.push(caption);
            }

            // Card has only Comments, add First Comment to Main Card
            if (hasLinkedComment) {
                const linkedComment = new TextSection();
                linkedComment.text = cardObject.comments[0];
                linkedComment.fontSize.current = 7;
                linkedComment.pins.left.state = true;
                card.sections.push(linkedComment);
            }
            
            main.append(card);

            unlinkedCards[cardSettings.activeCards.length - 1] = [];

            if (!hasComments) continue;

            // Add Comments as separate Unlinked Cards
            cardObject.comments.slice(hasLinkedComment ? 1 : 0).forEach(commentText => {
                const commentCard = new Card("medium");
                commentCard.x = cardObject.position.x;
                commentCard.rotate = "0deg";
                const comment = new TextSection();
                comment.text = commentText;
                comment.fontSize.current = 7;
                comment.pins.left.state = true;
                commentCard.sections.push(comment);
                unlinkedCards[cardSettings.activeCards.length - 1].push(commentCard);
            });
        }
        
        for (const i in saveObject) {
            const cardObject = saveObject[i];
            if (cardObject.connections === undefined) continue;
            if (cardSettings.activeCards[parseInt(i)] === null || cardSettings.activeCards[parseInt(i)] === undefined) {
                console.log("Tried to draw a connection from a non-existent card:", i);
                continue;
            }
                
            for (const c of cardObject.connections) {
                const iTopSection = cardSettings.activeCards[parseInt(i)].sections[0];
                if (cardSettings.activeCards[c] === null || cardSettings.activeCards[c] === undefined) {
                    console.log("Tried to draw a connection to a non-existent card.", i, c);
                    continue;
                }
                const cTopSection = cardSettings.activeCards[c].sections[0];

                if (iTopSection.pins.left.element.getConnection(cTopSection.pins.left.element) !== null) continue;
                if (iTopSection.pins.left.element.getConnection(cTopSection.pins.right.element) !== null) continue;
                if (iTopSection.pins.right.element.getConnection(cTopSection.pins.left.element) !== null) continue;
                if (iTopSection.pins.right.element.getConnection(cTopSection.pins.right.element) !== null) continue;

                let pinA;
                let pinB;

                if (!iTopSection.pins.right.state || cardObject.position.x > saveObject[c].position.x) {
                    pinA = iTopSection.pins.left.element;
                } else {
                    pinA = iTopSection.pins.right.element;
                }

                if (!cTopSection.pins.right.state || cardObject.position.x <= saveObject[c].position.x) {
                    pinB = cTopSection.pins.left.element;
                } else {
                    pinB = cTopSection.pins.right.element;
                }

                createPinString(pinA, pinB, "red");
            }
        }

        for (let i in unlinkedCards) {
            const mainCard = cardSettings.activeCards[i];
            const margin = 5;
            let y = mainCard.y + mainCard.getBoundingClientRect().height / 2 / pageSettings.zoom + margin;

            for (let card of unlinkedCards[i]) {
                main.append(card);
                const bounds = card.getBoundingClientRect();
                card.y = y + bounds.height / 2 / pageSettings.zoom;
                y += bounds.height / pageSettings.zoom + margin;
            }
        }

        cardSettings.activeCards = cardSettings.activeCards.filter(card => card !== null)

        updateCards();
    }

    window.addEventListener("load", loadLocal);
</script>
<script id="script-card-multiselect">
    var cardMultiSelectSettings = {
        x: null,
        y: null,
    };

    const multiSelectBox = document.getElementById("multiSelectBox");

    function updateMultiSelectBox() {
        multiSelectBox.style.left = Math.min(event.clientX, cardMultiSelectSettings.x) + "px";
        multiSelectBox.style.top = Math.min(event.clientY, cardMultiSelectSettings.y) + "px";
        multiSelectBox.style.width = Math.abs(event.clientX - cardMultiSelectSettings.x) + "px";
        multiSelectBox.style.height = Math.abs(event.clientY - cardMultiSelectSettings.y) + "px";
    }

    function selectMultiple() {
        if (event.button > 1) return;
        window.removeEventListener("mousemove", updateMultiSelectBox);
        window.removeEventListener("mouseup", selectMultiple);
        multiSelectBox.hidden = true;

        const coords = {
            x1: Math.min(event.clientX, cardMultiSelectSettings.x),
            y1: Math.min(event.clientY, cardMultiSelectSettings.y),
            x2: Math.max(event.clientX, cardMultiSelectSettings.x),
            y2: Math.max(event.clientY, cardMultiSelectSettings.y),
        };

        cardSettings.activeCards.filter(card => {
            const bounds = card.getBoundingClientRect();
            const leftEdge = bounds.x;
            const rightEdge = bounds.x + bounds.width;
            const topEdge = bounds.y;
            const bottomEdge = bounds.y + bounds.height;
            if (leftEdge > coords.x2) return false;
            if (rightEdge < coords.x1) return false;
            if (topEdge > coords.y2) return false;
            if (bottomEdge < coords.y1) return false;
            return true;
        }).forEach(card => card.becomePicked());

        cardMultiSelectSettings.x = 0;
        cardMultiSelectSettings.y = 0;
        multiSelectBox.style.left = 0;
        multiSelectBox.style.top = 0;
        multiSelectBox.style.width = 0;
        multiSelectBox.style.height = 0;
    }

    main.addEventListener("mousedown", () => {
        if (event.buttons & ~1 || event.shiftKey) return;
        if (document.getElementsByTagName("custom-card-preview").length > 0) return;

        window.addEventListener("mousemove", beginMultiSelect, {once: true});
        window.addEventListener("mouseup", () => {window.removeEventListener("mousemove", beginMultiSelect)}, {once: true});
    });

    function beginMultiSelect() {
        cardMultiSelectSettings.x = event.clientX;
        cardMultiSelectSettings.y = event.clientY;

        multiSelectBox.hidden = false;
        multiSelectBox.style.left = cardMultiSelectSettings.x + "px";
        multiSelectBox.style.top = cardMultiSelectSettings.y + "px";
        multiSelectBox.style.width = "0px";
        multiSelectBox.style.height = "0px";

        window.addEventListener("mousemove", updateMultiSelectBox);
        window.addEventListener("mouseup", selectMultiple);

        window.addEventListener("contextmenu", () => {
            event.preventDefault();
            multiSelectBox.hidden = true;
            window.removeEventListener("mousemove", updateMultiSelectBox);
            window.removeEventListener("mouseup", selectMultiple);
            return false;
        });
    }
</script>
